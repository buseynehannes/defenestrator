<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defenestrator Settings</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .status-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Window Specs List */
        #specsList {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .spec-item {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background: white;
        }

        .spec-bar {
            background: #f8f9fa;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 50px;
            border-radius: 8px;
            user-select: none;
        }

        .spec-bar:hover {
            background: #f0f4f8;
        }

        .spec-item.expanded .spec-bar {
            background: white;
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #e9ecef;
        }

        .spec-item.is-default .spec-bar {
            background: #f0fff4;
        }

        .spec-item.is-default:hover .spec-bar {
            background: #e8ffe8;
        }

        .spec-item.is-default.expanded .spec-bar {
            background: white;
            border-bottom: 1px solid #e9ecef;
        }

        .spec-name {
            font-weight: 600;
            color: #333;
            font-size: 15px;
            flex: 1;
            min-width: 100px;
        }

        .spec-sticky {
            font-size: 18px;
            margin-right: 4px;
        }

        .spec-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border: 1px solid #ddd;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-size: 16px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .btn-icon.btn-delete:hover {
            background: #e74c3c;
            border-color: #e74c3c;
        }

        /* Expandable Content */
        .spec-content {
            display: none;
            padding: 16px;
            background: white;
            border-radius: 0 0 8px 8px;
        }

        .spec-item.expanded .spec-content {
            display: block;
        }

        .spec-content-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            grid-column: 1 / -1;
        }

        .form-group small {
            display: block;
            margin-top: 4px;
            color: #666;
            font-size: 12px;
        }

        .form-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 8px;
        }

        .form-group label:has(input[type="checkbox"]) {
            display: flex;
            align-items: center;
            font-weight: normal;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0;
        }

        .form-group label:has(input[type="checkbox"]):hover {
            background: #f0f4f8;
            border-color: #667eea;
        }

        .color-section {
            display: flex;
            gap: 12px;
            align-items: center;
            grid-column: 1 / -1;
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker label {
            margin: 0;
            font-size: 12px;
            color: #666;
            font-weight: normal;
            min-width: 60px;
        }

        .color-picker input[type="color"] {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ddd;
            cursor: pointer;
            padding: 2px;
        }

        .color-picker input[type="color"]:hover {
            border-color: #667eea;
        }

        .info-box {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 6px;
            padding: 12px;
            color: #1565c0;
            font-size: 13px;
            grid-column: 1 / -1;
        }

        .default-badge {
            display: inline-block;
            background: #2ecc71;
            color: white;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-left: auto;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🪟 Defenestrator</h1>
            <p>Organize your browser windows by topic</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="card">
            <h2>Window Specifications</h2>
            <div id="specsList"></div>
            <div class="action-buttons">
                <button id="addSpecBtn" class="btn btn-primary">+ Add Specification</button>
            </div>
        </div>

        <div class="card">
            <h2>Settings</h2>
            <div class="action-buttons">
                <button id="saveConfigBtn" class="btn btn-success">💾 Save</button>
                <button id="resetConfigBtn" class="btn btn-danger">🔄 Reset</button>
                <button id="exportBtn" class="btn btn-secondary">📤 Export</button>
                <button id="importBtn" class="btn btn-secondary">📥 Import</button>
            </div>
        </div>
    </div>

    <script src="../polyfill/browser-polyfill.min.js"></script>
    <script type="module" src="../dist/options.js"></script>
</body>
</html>
