<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defenestrator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            width: 280px;
            min-height: 80px;
        }

        .popup {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spec-name {
            font-size: 16px;
            font-weight: 600;
            color: #cba6f7;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-sticky {
            background: #a6e3a1;
            color: #1e1e2e;
        }

        .badge-default {
            background: #45475a;
            color: #bac2de;
        }

        .urls {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .url-item {
            font-size: 11px;
            color: #a6adc8;
            background: #313244;
            border-radius: 4px;
            padding: 3px 7px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .btn-sticky {
            background: #cba6f7;
            color: #1e1e2e;
        }

        .btn-sticky.is-sticky {
            background: #45475a;
            color: #cdd6f4;
        }

        .btn-options {
            background: #313244;
            color: #cdd6f4;
            flex: 0;
            padding: 7px 10px;
        }

        .status {
            font-size: 12px;
            color: #6c7086;
            text-align: center;
        }

        .shortcut-hint {
            font-size: 10px;
            color: #45475a;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="popup" id="content">
        <div class="status">Loading…</div>
    </div>
    <script type="module" src="../dist/popup.js"></script>
</body>
</html>
