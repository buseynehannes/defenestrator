name: CI

on:
  pull_request:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build (includes type-checking)
        run: make build

      - name: Test
        run: make test
